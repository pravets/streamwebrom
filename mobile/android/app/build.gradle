plugins { id 'com.android.application' }

android {
    namespace 'lat.webrom.streamwebrom'
    compileSdk 35
    defaultConfig {
        applicationId 'lat.webrom.streamwebrom'
        minSdk 26
        targetSdk 35
        versionCode 11200
        versionName '1.12.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Release signing is opt-in and all-or-nothing: CI passes the four
    // properties from repository secrets, a local build may pass none. Reading
    // a property that is not set would throw MissingPropertyException while
    // configuring the project, breaking assembleDebug and Gradle sync too.
    def signingKeys = ['SWR_STORE_FILE', 'SWR_STORE_PASSWORD', 'SWR_KEY_ALIAS', 'SWR_KEY_PASSWORD']
    def signing = signingKeys.collectEntries { [(it): (project.findProperty(it) ?: '')] }
    def canSignRelease = signingKeys.every { signing[it] } &&
        new File(signing['SWR_STORE_FILE'] as String).exists()
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile file(signing['SWR_STORE_FILE'])
                storePassword signing['SWR_STORE_PASSWORD']
                keyAlias signing['SWR_KEY_ALIAS']
                keyPassword signing['SWR_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}
